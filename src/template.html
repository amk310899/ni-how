<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр HSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<script>
/* оформление хранится на устройстве отдельно от прогресса; по умолчанию ночной режим */
var UI={theme:'dark',pick:false};try{UI=Object.assign(UI,JSON.parse(localStorage.getItem('hsk-ui')||'{}'))}catch(e){}
function applyUI(){var r=document.documentElement;r.setAttribute('data-theme',UI.theme==='light'?'light':'dark');if(UI.pick)r.setAttribute('data-pick','1');else r.removeAttribute('data-pick')}
applyUI();
</script>
<style>
:root{
  /* Раскладка: одна колонка-«парта» по центру, крупные цели для пальца, иероглиф всегда главный объект экрана */
  --bg:#eef1f7; --surface:#ffffff; --ink:#16212e; --muted:#5d6b7a; --line:#d5dce4;
  --accent:#1f5bbf; --accent-ink:#ffffff; --soft:#e1eafa;
  --good:#1f7a4d; --good-soft:#dff1e7; --bad:#b3372f; --bad-soft:#f8e3e0; --warn:#946000; --warn-soft:#f7ecd3;
  --font-ui:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
  --font-py:"Noto Sans","Golos Text","Segoe UI",Arial,sans-serif;
  --font-zh:"HarmonyOS Sans SC","PingFang SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161d; --surface:#18212b; --ink:#e8edf2; --muted:#93a1b0; --line:#2b3745;
    --accent:#7fb0ff; --accent-ink:#071a36; --soft:#1c2942;
    --good:#5cc18d; --good-soft:#18301f; --bad:#ef7d72; --bad-soft:#3a1d1b; --warn:#e0a84a; --warn-soft:#33290f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161d; --surface:#18212b; --ink:#e8edf2; --muted:#93a1b0; --line:#2b3745;
  --accent:#7fb0ff; --accent-ink:#071a36; --soft:#1c2942;
  --good:#5cc18d; --good-soft:#18301f; --bad:#ef7d72; --bad-soft:#3a1d1b; --warn:#e0a84a; --warn-soft:#33290f;
}
/* пикми режим: розовая палитра для дня и ночи */
:root[data-pick]{
  --bg:#fdeaf2; --surface:#fffafc; --ink:#3b1529; --muted:#8a566d; --line:#f2c3d6;
  --accent:#d22d6a; --accent-ink:#ffffff; --soft:#ffdce9;
}
:root[data-pick][data-theme="dark"]{
  --bg:#1c1017; --surface:#2a1721; --ink:#fce8f0; --muted:#c998ae; --line:#4d2a3b;
  --accent:#ff8ab5; --accent-ink:#3d0a22; --soft:#47202f;
}
/* плавная смена оформления */
:root.theming,:root.theming *{transition:background-color .55s ease,color .55s ease,border-color .55s ease,fill .55s ease,stroke .55s ease !important}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.thm{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.thm svg{width:22px;height:22px;overflow:visible;transition:transform .7s cubic-bezier(.5,1.6,.4,1)}
.thm .core,.thm .cut,.thm .rays{transform-box:fill-box;transform-origin:center;transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .45s ease}
.thm .rays{transform-box:view-box;transform-origin:12px 12px}
:root[data-theme="dark"] .thm svg{transform:rotate(-30deg)}
:root[data-theme="dark"] .thm .core{transform:scale(1.75)}
:root[data-theme="dark"] .thm .cut{transform:translate(0,0)}
:root[data-theme="dark"] .thm .rays{transform:rotate(-90deg) scale(.2);opacity:0}
:root[data-theme="light"] .thm .cut{transform:translate(14px,-14px)}
.pkm{height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--font-ui);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color .4s,color .4s,border-color .4s,transform .2s}
.pkm:active{transform:scale(.95)}
.pkm .ht{color:#e0407c;display:inline-block;transition:transform .4s cubic-bezier(.5,1.8,.4,1)}
.pkm[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pkm[aria-pressed="true"] .ht{color:var(--accent-ink);transform:scale(1.3)}
.thm:focus-visible,.pkm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#hearts i{position:absolute;bottom:-30px;font-style:normal;color:#ff5c93;opacity:0;animation:hup var(--d,2.6s) ease-in var(--dl,0s) forwards;will-change:transform,opacity}
@keyframes hup{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.95}50%{transform:translate(var(--sx,10px),-50vh) scale(1)}100%{transform:translate(calc(var(--sx,10px)*-1),-108vh) scale(.85);opacity:0}}
.pickline{font-style:italic;margin:2px 0 6px}
.pickcard{display:none;grid-column:1/-1;padding:16px 18px;gap:12px;align-items:center;font-weight:600;font-size:16px;line-height:1.4;border-color:var(--accent);background:var(--soft)}
.pickcard .ht{color:var(--accent);font-size:26px;flex:none}
:root[data-pick] .tile3{display:none}
:root[data-pick] .pickcard{display:flex}
.pkonly{display:none}
:root[data-pick] .pkonly{display:revert}
.pickhi{display:none;border-color:var(--accent)}
:root[data-pick] .pickhi{display:block}
.pickhi h2{margin:4px 0 6px}.pickhi p{margin:4px 0}.pickhi .row{margin-top:10px}
.pkzh{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.pkzh .zh{font-family:var(--font-zh);font-size:28px;color:var(--accent)}
.pkzh .py{font-family:var(--font-py);color:var(--muted)}
.pkline2{font-weight:600;color:var(--accent)}
#pktoast{position:fixed;left:50%;top:76px;transform:translate(-50%,-12px);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:22px;font:600 15px var(--font-ui);opacity:0;pointer-events:none;z-index:70;transition:opacity .35s ease,transform .35s ease;max-width:86vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#pktoast.on{opacity:1;transform:translate(-50%,0)}
#hearts i{pointer-events:auto;padding:8px;margin:-8px;cursor:pointer}
#hearts i.pop{animation:hpop .35s ease-out forwards}
@keyframes hpop{to{transform:scale(2.6);opacity:0}}
.pkans{min-height:54px;font-family:var(--font-zh);font-size:34px;letter-spacing:6px;margin:6px 0}
.pkset{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pkset input{flex:1;min-width:130px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.45;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand .zh{font-family:var(--font-zh);color:var(--accent);font-size:20px}
.nav{display:flex;gap:6px}
.nav button{border:1px solid transparent;background:none;padding:8px 14px;border-radius:999px;font-weight:500;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--soft);color:var(--ink)}
.sync{font-size:13px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:24px 20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:14px 22px;border-radius:12px;font-weight:600;min-height:52px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.good{color:var(--good);border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:19px;padding:18px 28px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
/* главная */
.next{display:flex;flex-direction:column;gap:14px;border-left:6px solid var(--accent)}
.next h2{font-size:26px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.lv{display:flex;flex-direction:column;gap:8px;padding:16px}
.lv b{font-size:17px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .k{background:var(--accent)} .meter .m{background:var(--good)} .meter .l{background:var(--warn)} .meter .r{background:var(--bad)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--line)}
.legend .k::before{background:var(--accent)} .legend .m::before{background:var(--good)} .legend .l::before{background:var(--warn)} .legend .r::before{background:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:99px;background:var(--soft);font-size:14px;font-weight:500}
/* выбор уровня */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pick button{text-align:left;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:92px}
.pick button b{font-size:19px}
.pick button:not(:disabled):hover{border-color:var(--accent)}
/* свайп */
.deck{position:relative;height:340px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}
.swipe{width:min(100%,460px);height:320px;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;box-shadow:0 10px 30px rgba(10,30,50,.10);cursor:grab;position:relative;text-align:center}
.swipe .hz{font-family:var(--font-zh);font-size:92px;line-height:1.1}
.swipe .hz.long{font-size:58px}
.swipe .py{font-family:var(--font-py);font-size:24px;color:var(--accent)}
.swipe .ru{font-size:20px}
.swipe .hint{position:absolute;bottom:14px;font-size:14px;color:var(--muted)}
.swipe .tag{position:absolute;top:16px;font-weight:700;padding:4px 12px;border-radius:8px;opacity:0;font-size:15px}
.swipe .tag.yes{right:16px;color:var(--good);border:2px solid var(--good)}
.swipe .tag.no{left:16px;color:var(--bad);border:2px solid var(--bad)}
.hide{visibility:hidden}
.swipebtns{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;max-width:460px;margin:0 auto;width:100%}
/* задания */
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);animation:grow .45s cubic-bezier(.2,.7,.2,1) both}
.task{display:flex;flex-direction:column;gap:20px}
.prompt{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px 0}
.prompt .hz{font-family:var(--font-zh);font-size:76px;line-height:1.15}
.prompt .hz.long{font-size:52px}
.prompt .py{font-family:var(--font-py);font-size:22px;color:var(--accent);min-height:30px}
.prompt .ru{font-size:28px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-weight:500}
.opt .hz{font-family:var(--font-zh);font-size:34px;line-height:1.2}
.opt .py{font-family:var(--font-py);font-size:15px;color:var(--muted)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)} .fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb .zh{font-family:var(--font-zh);font-size:22px}
.fb .py{font-family:var(--font-py);color:var(--muted)}
.zhline{display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;align-items:flex-start}
.tok{border:0;background:none;padding:4px 6px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:38px}
.tok .py{font-family:var(--font-py);font-size:15px;color:var(--accent);line-height:1.2}
.tok .hz{font-family:var(--font-zh);font-size:38px;line-height:1.2}
.tok .gl{font-size:13px;color:var(--muted);max-width:112px;line-height:1.2}
.tok.known{border-bottom:2px dotted var(--line)}
.tok .py,.tok .gl{transition:opacity .25s,transform .25s}
.tok.known:not(.show) .py,.tok.known:not(.show) .gl{opacity:0;transform:translateY(4px);max-width:1.6em;max-height:1.25em;overflow:hidden;white-space:nowrap}
.tok.new{background:var(--soft)}
.answer{min-height:70px;border:2px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer:empty::before{content:"Собери перевод из плиток ниже";color:var(--muted);font-size:15px;padding:0 6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:48px;font-weight:500;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tile .hz{font-family:var(--font-zh);font-size:28px}
.tile .py{font-family:var(--font-py);font-size:13px;color:var(--muted)}
.tile.used{visibility:hidden}
.ruprompt{font-size:26px;font-weight:600;text-align:center}
/* карточка нового слова */
.intro{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.intro .hz{font-family:var(--font-zh);font-size:104px;line-height:1.1}
.intro .hz.long{font-size:64px}
.intro .py{font-family:var(--font-py);font-size:28px;color:var(--accent)}
.intro .ru{font-size:24px;font-weight:600}
.ex{border-top:1px solid var(--line);padding-top:14px;width:100%}
.say{border:1px solid var(--line);background:none;border-radius:99px;padding:8px 16px;font-size:15px}
/* словарь */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:99px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dict h3{font-size:15px;color:var(--muted);margin:18px 0 6px;font-weight:600}
.drow{display:grid;grid-template-columns:110px 130px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.drow .hz{font-family:var(--font-zh);font-size:24px}
.drow .py{font-family:var(--font-py);color:var(--accent);font-size:15px}
.stat{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;min-width:96px}
.stat.k{color:var(--accent);border-color:var(--accent)} .stat.m{color:var(--good);border-color:var(--good)} .stat.l{color:var(--warn);border-color:var(--warn)} .stat.r{color:var(--bad);border-color:var(--bad)}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
.faillist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.faillist div{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.faillist .hz{font-family:var(--font-zh);font-size:22px;margin-right:8px}
.faillist .py{font-family:var(--font-py);color:var(--accent);font-size:14px}
.score{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums}
.typed{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.typed input{flex:1;min-width:220px;max-width:420px;font:500 24px var(--font-py);padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.typed input.ok{border-color:var(--good);background:var(--good-soft)}
.typed input.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.side{display:flex;flex-direction:column;gap:10px}
.side h3{font-size:20px}
.zhline.lock .tok{cursor:default;border-bottom:0}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px}
.ex .tok .hz{font-size:28px}.ex .tok .py{font-size:13px}.ex .tok .gl{font-size:12px}
.ch{border:0;background:none;font:inherit;color:inherit;padding:0 2px;border-radius:12px;cursor:pointer;line-height:inherit}
.ch:hover,.ch:focus-visible{background:var(--soft)}
.modal{position:fixed;inset:0;background:rgba(8,16,32,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:18px;padding:20px;width:min(560px,100%);max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;animation:rise .25s both}
.sheet .cpy{font-family:var(--font-py);font-size:26px;color:var(--accent)}
.sheet .cru{font-size:20px;font-weight:600;margin-bottom:12px}
.sheet .drow{grid-template-columns:90px 110px 1fr}
.grid{flex:none;border:2px solid var(--line);border-radius:12px;touch-action:none;background-color:var(--bg);background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));background-size:1px 100%,100% 1px;background-position:center;background-repeat:no-repeat}
.grid.big{margin:0 auto}
.slots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.slot{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-zh);font-size:26px;color:var(--muted)}
.slot.ok{color:var(--ink);border-color:var(--good);background:var(--good-soft)}
.slot.cur{border:2px solid var(--accent)}
.fc{perspective:1200px;width:min(100%,460px);height:320px;margin:0 auto;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(10,30,50,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .hz{font-family:var(--font-zh);font-size:92px;line-height:1.1}.face .hz.long{font-size:56px}
.face .hzs{font-family:var(--font-zh);font-size:44px;line-height:1.2}
.face .py{font-family:var(--font-py);font-size:24px;color:var(--accent)}
.face .ru{font-size:22px;font-weight:600}
.face .hint{position:absolute;bottom:14px;font-size:14px;color:var(--muted)}
.swipebtns.two{grid-template-columns:1fr 1fr}
.typed.wide input{max-width:100%;font-size:20px;text-align:left}
@media (max-width:600px){
  body{font-size:16px}
  .bar{padding:8px 12px;gap:6px}.brand{font-size:16px}.brand .zh{font-size:18px}.sync{display:none}
  .nav{width:100%;justify-content:space-between}.nav button{padding:6px 10px;font-size:14px}
  main{padding:14px 12px 40px}.wrap{gap:14px}.card{padding:16px}
  h1{font-size:24px}.next h2{font-size:21px}.btn{padding:12px 16px;min-height:48px}.btn.big{font-size:17px;padding:14px 20px}

  H.bksave=async()=>{const n=await backupFile();if(n)go('home');else document.getElementById('bkmsg').textContent='Не удалось сохранить файл. Воспользуйся кодом в настройках.'};

/* ---------- проверка свайпами ---------- */
function vScreen(lv){
  const list=ALL.filter(w=>w.lv===lv&&!state.st[w.hz]);
  let i=0,yes=0,no=0,hist=[];
  const finish=()=>{state.scr[lv]=true;save();go('home')};
  function draw(){
    if(i>=list.length){finish();return}
    const w=list[i];
    view.innerHTML=`
    <div class="row" style="justify-content:space-between"><div><div class="eyebrow">Проверка ${LVNAME[lv]}</div><h2>Знаешь это слово?</h2></div>
    <span class="muted">${i+1} из ${list.length} · знаю ${yes} · учить ${no}</span></div>
    <div class="prog"><i style="--from:${100*Math.max(0,i-1)/list.length}%;width:${100*i/list.length}%"></i></div>
    <div class="deck"><div class="swipe flipc" id="sw" tabindex="0" role="button" aria-label="Перевернуть карточку">
      <span class="tag no">НЕ ЗНАЮ</span><span class="tag yes">ЗНАЮ</span>
      <div class="fc-in">
        <div class="face front"><div class="hz${long(w.hz)}">${esc(w.hz)}</div><span class="hint">Нажми, чтобы перевернуть</span></div>
        <div class="face back"><div class="hzs">${esc(w.hz)}</div><div class="py">${esc(w.py)}</div><div class="ru${w.ru.length>45?' long':''}">${esc(w.ru)}</div><span class="hint">Свайп вправо: знаю. Влево: не знаю</span></div>
      </div>
    </div></div>
    <div class="swipebtns"><button class="btn bad" data-act="no">← Не знаю</button><button class="btn ghost" data-act="undo" ${hist.length?'':'disabled'}>Назад</button><button class="btn good" data-act="yes">Знаю →</button></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="stop">Закончить проверку, остальное буду учить</button></div>`;
    bindSwipe(document.getElementById('sw'));
  }
  let busy=false;
  function decide(k){
    if(busy)return;busy=true;
    const el=document.getElementById('sw');
    if(el){el.style.transition='transform .22s ease-in,opacity .22s';el.style.transform=`translateX(${k?560:-560}px) rotate(${k?20:-20}deg)`;el.style.opacity=0;const tg=el.querySelector(k?'.yes':'.no');if(tg)tg.style.opacity=1}
    setTimeout(()=>{busy=false;const w=list[i];setSt(w,k?'k':'u');hist.push(k);k?yes++:no++;i++;if(i%10===0)save();draw()},200);
  }
  function bindSwipe(el){
    let x0=null,dx=0,moved=false;
    const yesT=el.querySelector('.yes'),noT=el.querySelector('.no');
    el.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;moved=false;el.setPointerCapture(e.pointerId);el.style.transition='none'});
    el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>8)moved=true;el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;yesT.style.opacity=Math.max(0,Math.min(1,dx/90));noT.style.opacity=Math.max(0,Math.min(1,-dx/90))});
    const up=()=>{if(x0===null)return;x0=null;
      if(Math.abs(dx)>90){decide(dx>0);return}
      el.style.transition='transform .2s';el.style.transform='';yesT.style.opacity=0;noT.style.opacity=0;
      if(!moved){el.classList.toggle('flip');if(el.classList.contains('flip'))auto(list[i].hz)}};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
    el.addEventListener('keydown',e=>{if(e.key==='ArrowRight')decide(true);if(e.key==='ArrowLeft')decide(false);if(e.key===' '||e.key==='Enter'){e.preventDefault();el.classList.toggle('flip')}});
    el.focus({preventScroll:true});
  }
  H.yes=()=>decide(true);H.no=()=>decide(false);
  H.undo=()=>{if(!hist.length)return;const k=hist.pop();i--;k?yes--:no--;delete state.st[list[i].hz];draw()};
  H.stop=()=>{save();finish()};
  if(!list.length){finish();return}
  draw();
}

/* ---------- отрисовка китайского текста ---------- */
// известное слово: пиньинь и перевод по нажатию; неизвестное: сразу
function tokHTML(hz,newSet,noHelp){
  const w=WM.get(hz);if(!w)return `<span class="tok"><span class="py">&nbsp;</span><span class="hz">${esc(hz)}</span><span class="gl">&nbsp;</span></span>`;
  const known=noHelp||(isKnown(w)&&!(newSet&&newSet.has(hz)));
  return `<button class="tok ${known?'known':'new'}" data-hz="${esc(hz)}"><span class="py">${esc(w.py)}</span><span class="hz">${esc(hz)}</span><span class="gl">${esc(gloss(w))}</span></button>`;
}
const zhLine=(toks,newSet)=>`<div class="zhline">${toks.map(t=>tokHTML(t,newSet)).join('')}</div>`;
const normRu=s=>s.toLowerCase().replace(/[.,!?;:«»"()]/g,'').trim();
// слова в скобках необязательны: «Давай (мы) встретимся»
const ruParts=s=>s.split(' ').map(t=>({k:normRu(t),opt:t[0]==='('}));
const DONE='<svg class="done" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38"/><path d="M26 43l11 11 21-23"/></svg>';

function distract(w,n){
  const cap=w.custom?Math.max(1,Math.min(target(),MAXL)):Math.max(w.lv,Math.min(target(),MAXL));
  const cw=core(w),ok=x=>x.hz!==w.hz&&x.ru!==w.ru&&core(x)!==cw&&!x.hz.includes(w.hz)&&!w.hz.includes(x.hz)&&(x.lv<=cap||(w.custom&&x.custom));
  const same=shuffle(ALL.filter(x=>ok(x)&&x.th===w.th&&x.lv===w.lv)).slice(0,2);
  const rest=shuffle(ALL.filter(x=>ok(x)&&!same.includes(x)&&(w.custom||Math.abs(x.lv-w.lv)<=1)));
  const out=same.filter((x,i,a)=>a.findIndex(y=>core(y)===core(x))===i),seen=new Set(out.map(core));
  for(const x of rest){if(out.length>=n)break;if(!seen.has(core(x))){out.push(x);seen.add(core(x))}}
  return out.slice(0,n);
}

/* ---------- 3. разбор ошибки: какое правило нарушено ---------- */
// Эвристика: смотрим, какие служебные слова стоят в предложении и на каких местах ответ разошёлся с образцом.
// парные конструкции: правило уместно, только если в предложении есть вторая часть пары
const NEED={'只有':['才'],'只要':['就'],'连':['都','也'],'即使':['也'],'既':['又','也'],'不但':['而且','还','也'],'不仅':['而且','还','也'],'不光':['而且','还','也'],'不管':['都','也'],'无论':['都','也'],'不论':['都','也'],'虽然':['但是','可是','不过','但'],'因为':['所以'],'如果':['就','的话'],'先':['然后','再'],'既然':['就'],'尽管':['仍然','还是','但是','仍'],'由于':['因此','所以']};
const needOk=(g,s)=>g.k.filter(k=>s.zh.includes(k)).some(k=>!NEED[k]||NEED[k].some(n=>s.zh.includes(n)));
// o: {got: плитки ответа, zr: собирали русский перевод, key+picked: задание «вставь слово», typed: набранный текст}
function gramHint(s,o){
  o=o||{};let got=o.got,miss=[],extra=[],order=false;const parts=[];
  if(o.typed){got=seg(o.typed);if(!got.length)got=null}
  if(o.key){miss=[o.key];extra=o.picked&&o.picked!==o.key?[o.picked]:[]}
  else if(got&&!o.zr){
    const rest=got.slice();
    miss=s.zh.filter(x=>{const i=rest.indexOf(x);if(i>=0){rest.splice(i,1);return false}return true});
    extra=rest.filter(x=>WM.has(x));order=!miss.length&&!rest.length;
  }
  const hw=x=>`<span class="hzw" role="button" tabindex="0" data-w="${x}">${x}</span>`;
  if(order)parts.push('<div>Слова выбраны верно, ошибка в порядке. Базовый порядок в китайском: кто + когда + где + как + действие + что. Время и место стоят перед глаголом, а не в конце фразы.</div>');
  let head='Разбор ошибки',used=[];
  if(o.zr){
    // сборка русского перевода: показываем только то, чем ответ отличается от образца
    const ref=ruParts(s.ru),rest=(o.got||[]).slice();
    const lost=ref.filter(p=>{const i=rest.indexOf(p.k);if(i>=0){rest.splice(i,1);return false}return !p.opt}).map(p=>p.k);
    const opt=new Set(ref.filter(p=>p.opt).map(p=>p.k)),more=rest.filter(x=>!opt.has(x));
    if(lost.length||more.length)parts.push(`<div>${lost.length?'В переводе не хватает: '+lost.map(esc).join(', ')+'. ':''}${more.length?'Лишнее: '+more.map(esc).join(', ')+'.':''}</div>`);
  }else{
    // 1) одно слово заменено похожим
    const sim=SIM.find(g=>miss.some(m=>g.k.includes(m))&&extra.some(e=>g.k.includes(e)));
    if(sim){const m=miss.find(x=>sim.k.includes(x)),e=extra.find(x=>sim.k.includes(x));used=[m,e];
      parts.push(`<div>У тебя ${hw(e)}, а здесь нужно ${hw(m)}.</div><div><b>${linkHz(sim.t)}</b>${simLines(sim,[m,e])}</div>`)}
    // 2) пропущено или заменено слово, с которым связано правило
    const near=miss.length+extra.length<=3;
    if(!near&&!o.key&&miss.length<=6)parts.push(`<div>В ответе не хватает: ${miss.map(hw).join('、')}.${extra.length?' Лишнее: '+extra.map(hw).join('、')+'.':''}</div>`);
    (near||o.key?GR:[]).filter(g=>g.k.some(k=>(miss.includes(k)||extra.includes(k))&&!used.includes(k))&&needOk(g,s)).slice(0,sim?1:2)
      .forEach(g=>parts.push(`<div><div><b>${linkHz(g.t)}</b></div><div class="f">${linkHz(g.f)}</div><div>${linkHz(g.r)}</div></div>`));
    // 3) пропущено обычное слово
    if(!parts.length&&miss.length&&miss.length<=3&&!o.key)parts.push(`<div>В ответе не хватает: ${miss.map(hw).join('、')}.${extra.length?' Лишнее: '+extra.map(hw).join('、')+'.':''}</div>`);
  }
  return parts.length?`<div class="ghint"><b>${head}</b>${parts.join('')}</div>`:'';
}

/* ---------- урок ---------- */
function pickSents(ws,newSet,n){
  const mx=Math.max(...ws.map(w=>w.lv));
  const unk=s=>s.zh.filter(t=>!newSet.has(t)&&WM.get(t)&&!isKnown(WM.get(t))).length;
  let a=shuffle(SENT.filter(s=>s.lv<=mx&&s.zh.some(t=>newSet.has(t)))).sort((x,y)=>unk(x)-unk(y));
  if(a.length<n){const b=shuffle(SENT.filter(s=>!a.includes(s)&&s.lv<=mx&&s.zh.every(t=>newSet.has(t)||(WM.get(t)&&isKnown(WM.get(t))))));a=a.concat(b)}
  return a.slice(0,n);
}
function vLesson(arg){

      const fill=distract(w,3).map(x=>x.hz).filter(k=>!mates.includes(k)&&!s.zh.includes(k));

// одна структура: объяснение → задания → диалог → тест
function vGram(g){
  if(!g){go('grammar');return}
  // предложения берём по очереди на каждое слово структуры, чтобы ответом бывали все её варианты
  const per=g.k.map(k=>shuffle(SENT.filter(s=>s.zh.includes(k))).sort((a,b)=>a.lv-b.lv||a.zh.length-b.zh.length).slice(0,12)).filter(a=>a.length);
  const pool=[];for(let i=0;i<12;i++)for(const a of shuffle(per))if(a[i]&&!pool.includes(a[i]))pool.push(a[i]);
  const others=[...new Set(GR.filter(x=>x!==g&&Math.abs(x.lv-g.lv)<=1).flatMap(x=>x.k))].filter(k=>!g.k.includes(k)&&k.length<=2);
  // варианты ответа: сначала парные слова той же структуры, затем слова, которые с ними путают
  const gapOf=s=>{
    const key=shuffle(s.zh.filter(t=>g.k.includes(t)))[0],ok=k=>k!==key&&!s.zh.includes(k)&&WM.get(k);
    const sib=shuffle(g.k.filter(ok)).slice(0,3);
    const conf=shuffle([...new Set(CONF.filter(c=>c.includes(key)||g.k.some(k=>c.includes(k))).flat())].filter(k=>ok(k)&&!sib.includes(k)));
    const rest=shuffle(others.filter(k=>ok(k)&&!sib.includes(k)&&!conf.includes(k)));
    return {type:'gap',gram:true,s,w:WM.get(key),opts:[key].concat(sib,conf,rest).slice(0,4)}};
  // контрастные задания: правильный ответ не слово этой структуры, а похожее на него
  const mates=[...new Set(CONF.filter(c=>g.k.some(k=>c.includes(k))).flat())].filter(k=>!g.k.includes(k)&&WM.get(k));
  const contrast=n=>shuffle(mates).map(m=>{
    const s=shuffle(SENT.filter(s=>s.zh.includes(m)&&!s.zh.some(t=>g.k.includes(t))&&s.lv<=Math.max(g.lv,2)&&s.zh.length<=8))[0];if(!s)return null;
    const ok=k=>k!==m&&!s.zh.includes(k)&&WM.get(k);
    return {type:'gap',gram:true,s,w:WM.get(m),opts:[m].concat(shuffle(g.k.filter(ok)).slice(0,2),shuffle(mates.filter(ok))).slice(0,4)}}).filter(Boolean).slice(0,n);
  const asS=x=>({zh:x[0],ru:x[1],lv:g.lv});
  const steps=k=>`<div class="steps">${['Объяснение','Задания','Диалог','Тест'].map((n,i)=>`<span class="${i===k?'on':''}">${i+1}. ${n}</span>`).join('')}</div>`;
  const dlg=DLG.filter(d=>d.l.some(l=>l[1].some(t=>g.k.includes(t)))).sort((a,b)=>Math.abs(a.lv-g.lv)-Math.abs(b.lv-g.lv))[0];
  function explain(){
    H={};
    view.innerHTML=`<div class="row" style="justify-content:space-between"><div class="eyebrow">Грамматика · ${LVNAME[g.lv]}</div><button class="btn ghost sm" data-act="list">Все структуры</button></div>
    ${steps(0)}<h1>${linkHz(g.t)}</h1>
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <div><div class="muted small">Схема</div><div class="formula">${linkHz(g.f)}</div></div>
      <p style="margin:0">${linkHz(g.r)}</p>
      <div><div class="muted small">Что важно</div><ul class="gpts">${g.p.map(x=>`<li>${linkHz(x)}</li>`).join('')}</ul></div>
      <div class="gerr"><b>Частая ошибка.</b> ${linkHz(g.e)}</div>
      ${[...new Set(g.k.flatMap(simOf))].map(s=>`<div><div class="muted small">Не путай</div><b>${linkHz(s.t)}</b>${simLines(s)}</div>`).join('')}

let cardSide='hz';
function vCards(ws){
  if(!ws||!ws.length){go('train');return}
  const deck=ws.slice(),total=ws.length,again=new Set();let i=0,ok=0;
  function draw(){
    if(i>=deck.length){save();
      view.innerHTML=`<div class="card next">${DONE}<div class="eyebrow">Карточки пройдены</div><h2>${total} слов</h2><p class="muted">С первого раза: ${total-again.size}. Возвращались повторно: ${again.size}.</p><div class="row"><button class="btn primary big" data-act="back">К тренировкам</button></div></div>`;
      H={back:()=>go('train')};return}
    const w=deck[i];
    view.innerHTML=`<div class="row" style="justify-content:space-between"><div class="eyebrow">Карточки · ${ok} из ${total}</div><div class="row"><button class="btn ghost sm" data-act="side">Сначала: ${cardSide==='hz'?'иероглиф':'перевод'}</button><button class="btn ghost sm" data-act="quit">Выйти</button></div></div>
    <div class="prog"><i style="--from:${100*Math.max(0,ok-1)/total}%;width:${100*ok/total}%"></i></div>
    <div class="fc" id="fc" tabindex="0" role="button" aria-label="Перевернуть карточку"><div class="fc-in">
      <div class="face front">${cardSide==='hz'?`<div class="hz${long(w.hz)}">${esc(w.hz)}</div>`:`<div class="ru">${esc(w.ru)}</div>`}<span class="hint">Нажми, чтобы перевернуть</span></div>
      <div class="face back"><div class="hzs">${chars(w.hz)}</div><div class="py">${esc(w.py)}</div><div class="ru${w.ru.length>45?' long':''}">${esc(w.ru)}</div><button class="say" data-act="say">Произнести</button></div>
    </div></div>
    <div class="swipebtns two"><button class="btn bad" data-act="no">Не помню</button><button class="btn good" data-act="yes">Помню</button></div>`;
    const fc=document.getElementById('fc');
    fc.addEventListener('click',e=>{if(e.target.closest('[data-act],.ch'))return;fc.classList.toggle('flip')});
    fc.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.classList.toggle('flip')}if(e.key==='ArrowRight')H.yes();if(e.key==='ArrowLeft')H.no()});
    fc.focus({preventScroll:true});
  }
  H.say=()=>speak(deck[i].hz);
  H.side=()=>{cardSide=cardSide==='hz'?'ru':'hz';draw()};
  H.quit=()=>{save();go('train')};
  H.yes=()=>{ok++;i++;draw()};

}
function vWrite(ws){
  if(!ws||!ws.length){go('train');return}
  let wi=0,ci=0,outline=false,writer=null,miss=0,skipped=false;const res=[];
  const size=Math.max(220,Math.min(320,view.clientWidth-48));
  function done(){
    view.innerHTML=`<div class="card next">${DONE}<div class="eyebrow">Тренировка письма завершена</div><h2>${ws.length} слов</h2>
      <div class="faillist">${res.map(r=>`<div><span class="hz">${esc(r.w.hz)}</span><span class="py">${esc(r.w.py)}</span><div class="small">${r.skip?'пропущено':r.miss?'ошибок в чертах: '+r.miss:'без ошибок'}</div></div>`).join('')}</div>
      <div class="row"><button class="btn primary big" data-act="back">К тренировкам</button></div></div>`;
    H={back:()=>go('train')};
  }
  function quiz(){writer.quiz({onComplete:s=>{miss+=s.totalMistakes;setTimeout(nextChar,650)}})}
  function draw(){
    if(wi>=ws.length){done();return}
    const w=ws[wi],cs=[...w.hz];
    view.innerHTML=`<div class="row" style="justify-content:space-between"><div class="eyebrow">Письмо · слово ${wi+1} из ${ws.length}</div><button class="btn ghost sm" data-act="quit">Выйти</button></div>
    <div class="prog"><i style="--from:${100*Math.max(0,wi-1)/ws.length}%;width:${100*wi/ws.length}%"></i></div>
    <div class="card task"><div class="prompt"><div class="py">${esc(w.py)}</div><div class="ru">${esc(w.ru)}</div>
      <div class="slots">${cs.map((x,k)=>`<span class="slot ${k<ci?'ok':k===ci?'cur':''}">${k<ci?esc(x):'?'}</span>`).join('')}</div></div>
      <div class="grid big" id="wr" style="width:${size}px;height:${size}px"></div>
      <div class="row" style="justify-content:center"><button class="btn sm" data-act="outline">${outline?'Скрыть контур':'Показать контур'}</button><button class="btn sm" data-act="anim">Показать, как пишется</button><button class="btn ghost sm" data-act="skip">Пропустить</button></div>
      <p class="muted small" style="text-align:center;margin:0">Веди черты пальцем в правильном порядке. После двух промахов нужная черта подсветится.</p></div>`;
    writer=HanziWriter.create(document.getElementById('wr'),cs[ci],hwOpts(size,{showCharacter:false,showOutline:outline}));quiz();
  }
  function nextChar(){
    const w=ws[wi];ci++;
    if(ci>=[...w.hz].length){res.push({w,miss,skip:skipped});auto(w.hz);miss=0;skipped=false;ci=0;wi++}
    draw();
  }
  H.outline=b=>{outline=!outline;outline?writer.showOutline():writer.hideOutline();b.textContent=outline?'Скрыть контур':'Показать контур'};
  H.anim=()=>{writer.cancelQuiz();writer.animateCharacter({onComplete:()=>setTimeout(()=>{writer.hideCharacter();quiz()},500)})};
  H.skip=()=>{skipped=true;try{writer.cancelQuiz()}catch(e){}nextChar()};
  H.quit=()=>go('train');
  draw();
}

/* ---------- словарь ---------- */
let dictLv=1,dictQ='';
function vDict(){
  const SN={k:'знаю',u:'учить',l:'ждёт экзамена',m:'сдано',r:'повторение'};
  if(dictLv==='my'){vMy();return}
  const hardTab=dictLv==='hard';
  const ws=hardTab?hardList():ALL.filter(w=>w.lv===dictLv);let html=hardTab&&!ws.length?'<p class="muted">Трудных слов нет. Сюда попадают слова с двумя и более ошибками.</p>':'',th='';
  for(const w of ws){
    if(!hardTab&&w.th!==th){th=w.th;html+=`<h3>${esc(TH[th])}</h3>`}
    const s=st(w),sr=state.srs[w.hz];
    const note=hardTab?`ошибок: ${errs(w)}`:(s==='m'&&sr?`повтор ${sr[1]<=today()?'сегодня':'через '+(sr[1]-today())+' дн.'}`:'');
    html+=`<div class="drow"><span class="hz">${esc(w.hz)}</span><span class="py">${esc(w.py)}</span><span class="ru">${esc(w.ru)}${note?` <span class="muted small">· ${note}</span>`:''}</span><button class="stat ${s}" data-act="tog" data-hz="${esc(w.hz)}">${SN[s]}</button></div>`;
  }
  const row=w=>{const s=st(w);return `<div class="drow"><span class="hz">${esc(w.hz)}</span><span class="py">${esc(w.py)}</span><span class="ru">${esc(w.ru)} <span class="muted small">· ${LVNAME[w.lv]}</span></span><button class="stat ${s}" data-act="tog" data-hz="${esc(w.hz)}">${SN[s]}</button></div>`};
  const find=q=>{const ql=q.toLowerCase().trim(),qp=plain(q),lat=/[a-zü]/i.test(q)&&!/[а-яё]/i.test(q);if(!ql)return null;
    const r=ALL.filter(w=>w.hz.includes(ql)||w.ru.toLowerCase().includes(ql)||(lat&&qp&&plain(w.py).includes(qp)));
    const sc=w=>(w.hz===ql||plain(w.py)===qp||w.ru.toLowerCase()===ql?0:(w.hz.startsWith(ql)||(lat&&plain(w.py).startsWith(qp))||w.ru.toLowerCase().startsWith(ql)?1:2));
    return r.sort((a,b)=>sc(a)-sc(b)||a.f-b.f).slice(0,80)};
  const base=html;
  const show=()=>{const r=find(dictQ),el=document.getElementById('dres'),sec=pkSecret(dictQ);if(sec){el.innerHTML=sec;return}
    el.innerHTML=r===null?base:(r.length?`<h3>Найдено: ${r.length}${r.length===80?' (показаны первые 80)':''}</h3>`+r.map(row).join(''):'<p class="muted">Ничего не найдено. Попробуй другое слово или пиньинь без тонов.</p>')};
  view.innerHTML=`<div><h1>Словарь</h1><p class="muted">Нажми на статус, чтобы вручную отметить слово как известное или вернуть его в изучение.</p></div>
  <input class="search" id="dq" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Поиск по словарю" placeholder="Поиск: 汉字, pinyin, русский" value="${esc(dictQ)}">
  <div class="tabs">${[1,2,3,4].map(l=>`<button data-act="lv" data-lv="${l}" aria-pressed="${l===dictLv}">${LVNAME[l]} · ${counts(l).n}</button>`).join('')}<button data-act="lv" data-lv="hard" aria-pressed="${hardTab}">Трудные · ${hardList().length}</button><button data-act="lv" data-lv="my" aria-pressed="false">Мои слова · ${state.custom.length}</button></div>
  <div class="card dict" id="dres"></div>`;
  show();
  document.getElementById('dq').addEventListener('input',e=>{dictQ=e.target.value;show()});
  H.lv=b=>{const v=b.dataset.lv;dictQ='';dictLv=v==='hard'||v==='my'?v:+v;vDict()};
  H.tog=b=>{const w=WM.get(b.dataset.hz),s=st(w),n=s==='u'||s==='r'?'k':'u';setSt(w,n);state.batch=state.batch.filter(h=>h!==w.hz);state.relearn=state.relearn.filter(h=>h!==w.hz);delete state.srs[w.hz];save();b.className='stat '+n;b.textContent=SN[n]};
}

  <div class="card"><h3>Экзамен и повторение</h3><p class="muted">Половина вопросов требует набрать ответ с клавиатуры: пиньинь без тонов (например, pengyou) или иероглифы. Если выключить, везде будет выбор из четырёх вариантов.</p>
    <div class="row"><button class="btn" data-act="typed">Ввод с клавиатуры: ${state.typed?'включён':'выключен'}</button></div></div>
  <div class="card"><h3>Звук</h3><p class="muted">В режиме без аудирования нет заданий на слух и слова не озвучиваются сами. Кнопки «Произнести» и «Слушать» продолжают работать.</p>
    <div class="row"><button class="btn" data-act="noaudio">Режим без аудирования: ${state.noAudio?'включён':'выключен'}</button></div></div>
  <div class="card"><h3>Отмеченные ошибки: ${state.flags.length}</h3><p class="muted">Фразы и слова, которые ты отметил кнопкой «Отметить ошибку». Скопируй список и отправь на исправление.</p>
    <textarea id="flags" aria-label="Отмеченные ошибки" readonly>${esc(state.flags.join('\n'))}</textarea>
    <div class="row"><button class="btn" data-act="fcopy" ${state.flags.length?'':'disabled'}>Скопировать список</button><button class="btn ghost" data-act="fclear" ${state.flags.length?'':'disabled'}>Очистить</button><span class="muted small" id="fmsg"></span></div></div>
  <div class="card"><h3>Автоматическая копия в папку</h3>
    ${FS_OK?`<p class="muted">${{none:'Папка не создана. Нажми кнопку: откроется системное окно в «Документах», подтверди доступ, и приложение само создаст там папку «'+BKNAME+'». Дальше оно само сохраняет в неё копию после каждого изменения и при запуске загружает самую свежую.',on:'Подключена папка «'+esc(bkDir?bkDir.name:'')+'». Новая версия приложения обращается к ней же. Копия обновляется сама, при запуске загружается самая свежая из найденных в папке.',ask:'Папка «'+esc(bkDir?bkDir.name:'')+'» выбрана, но браузер просит подтвердить доступ.',err:'Не удалось записать в папку. Выбери её заново.'}[bkState]}</p>
    <div class="row">${bkState==='ask'?'<button class="btn primary" data-act="bkgrant">Разрешить доступ</button>':''}<button class="btn ${bkState==='none'?'primary':''}" data-act="bkpick">${bkState==='none'?'Создать папку для копий':'Создать папку в другом месте'}</button>${bkState!=='none'?'<button class="btn ghost" data-act="bkoff">Отключить папку</button>':''}</div>
    <p class="muted small" style="margin:10px 0 0">Если это папка облачного диска, прогресс будет переходить между устройствами. Сюда же можно положить файл копии с другого устройства: приложение возьмёт самый свежий.</p>`
    :`<p class="muted">Этот браузер не разрешает приложению самому работать с папками, поэтому находить и загружать копию автоматически здесь нельзя. Используй кнопки ниже или открой приложение в Chrome.</p>`}
    <p class="muted small" id="bkdmsg" style="margin:10px 0 0"></p></div>
  <div class="card"><h3>Резервная копия в файл</h3><p class="muted">${state.lastBackup?'Последняя копия: '+(today()-state.lastBackup?(today()-state.lastBackup)+' дн. назад':'сегодня'):'Копия ещё не сохранялась'}. Файл попадает в папку загрузок. Чтобы перенести прогресс, открой этот файл на другом устройстве кнопкой «Загрузить копию».</p>
    <div class="row"><button class="btn primary" data-act="bksave">Сохранить копию в файл</button><button class="btn" data-act="bkload">Загрузить копию из файла</button><input type="file" id="bf" accept=".json,.txt,application/json,text/plain" hidden></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="bkauto">Сохранять копию перед каждым экзаменом: ${state.autoBackup?'включено':'выключено'}</button></div>
    <p class="muted small" id="bkmsg" style="margin:10px 0 0"></p><div class="row" id="bkconf"></div></div>
  <div class="card"><h3>Перенос прогресса кодом</h3><p class="muted">Запасной способ без файла: скопируй код и вставь его на другом устройстве.</p>
    <textarea id="code" aria-label="Код прогресса"></textarea>
    <div class="row"><button class="btn" data-act="exp">Показать и скопировать мой код</button><button class="btn" data-act="imp">Загрузить прогресс из кода</button><span class="muted small" id="msg"></span></div></div>
  <div class="card"><h3>О данных</h3><p class="muted">Версия приложения: __VER__ от __VDATE__. Списки слов: HSK 3.0, редакция 2025 года. Порядок черт: библиотека Hanzi Writer и данные Make Me a Hanzi (открытые лицензии).</p></div>
  <div class="card"><h3>Сброс</h3><p class="muted">Удаляет весь прогресс без возможности восстановления.</p>
    <div class="row" id="rst"><button class="btn bad" data-act="rst1">Сбросить прогресс</button></div></div>`;
  const msg=t=>document.getElementById('msg').textContent=t;
  const bmsg=t=>{document.getElementById('bkmsg').textContent=t};
  H.bksave=async()=>{const n=await backupFile();if(n){vSettings();bmsg('Копия сохранена: '+n)}else bmsg('Не удалось сохранить файл. Воспользуйся кодом ниже.')};
  H.bkauto=()=>{state.autoBackup=!state.autoBackup;save();vSettings()};
  H.bkpick=async()=>{try{await bkPick();vSettings()}catch(e){if(e&&e.name!=='AbortError')document.getElementById('bkdmsg').textContent='Браузер не дал доступ к папке. Попробуй другую папку или сохраняй копию кнопкой ниже.'}};
  H.bkgrant=async()=>{await bkGrant();vSettings()};
  H.bkoff=async()=>{await bkOff();vSettings()};
  H.bkload=()=>document.getElementById('bf').click();
  document.getElementById('bf').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
    r.onerror=()=>bmsg('Не удалось прочитать файл.');
    r.onload=()=>{const d=parseBackup(String(r.result||''));
      if(!d){bmsg('Это не файл копии прогресса или он повреждён.');return}
      const n=Object.keys(d.st).length,when=d.ts?new Date(d.ts).toLocaleDateString('ru-RU'):'дата неизвестна';
      bmsg(`В копии: уровень ${d.level===null?'не выбран':LVNAME[d.level]}, слов с отметками: ${n}, своих слов: ${(d.custom||[]).length}, сохранено ${when}. Текущий прогресс будет заменён.`);
      document.getElementById('bkconf').innerHTML='<button class="btn bad" data-act="bkyes">Заменить прогресс копией</button><button class="btn" data-act="bkno">Отмена</button>';
      H.bkyes=()=>{state=Object.assign(fresh(),d);rebuild(state.custom);save();vSettings();document.getElementById('bkmsg').textContent='Прогресс загружен из копии.'};
      H.bkno=()=>vSettings();
    };r.readAsText(f);
  });
  H.pick=()=>go('pick');
  H.typed=()=>{state.typed=!state.typed;save();vSettings()};
  H.noaudio=()=>{state.noAudio=!state.noAudio;if(!state.noAudio)sessNoAudio=false;save();vSettings()};
  H.fcopy=()=>{const m=document.getElementById('fmsg');try{navigator.clipboard.writeText(state.flags.join('\n')).then(()=>{m.textContent='Список скопирован'},()=>{m.textContent='Выдели текст в поле и скопируй вручную'})}catch(e){m.textContent='Выдели текст в поле и скопируй вручную'}};
  H.fclear=()=>{state.flags=[];save();vSettings()};
  H.scr=b=>{const l=+b.dataset.lv;for(const w of ALL)if(w.lv===l&&'ku'.includes(st(w)))delete state.st[w.hz];go('screen',l)};
  H.exp=()=>{const c=btoa(unescape(encodeURIComponent(JSON.stringify(state))));document.getElementById('code').value=c;
    try{navigator.clipboard.writeText(c).then(()=>msg('Код скопирован'),()=>msg('Скопируй код из поля вручную'))}catch(e){msg('Скопируй код из поля вручную')}};
  H.imp=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('code').value.trim()))));if(!d||d.v!==1)throw 0;state=Object.assign(fresh(),d);rebuild(state.custom);save();msg('Прогресс загружен')}catch(e){msg('Код не распознан: проверь, что он вставлен целиком')}};
  H.rst1=()=>{document.getElementById('rst').innerHTML='<span>Точно удалить весь прогресс?</span><button class="btn bad" data-act="rst2">Да, удалить</button><button class="btn" data-act="rst0">Отмена</button>'};
  H.rst0=()=>vSettings();
  H.rst2=()=>{state=fresh();rebuild([]);save();go('pick')};
}

loadLocal();syncLabel();go(state.level===null?'pick':'home');initCloud();bkInit();
</script>
</body>
</html>
